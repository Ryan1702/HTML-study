<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>个人简介</title>
    </head>
    <body>
        &lt;<!--小于号-->
        &nbsp;<!--空格-->
        &gt;<!--大于号-->
        你&nbsp;&nbsp;&nbsp;&nbsp;我
        <form>
            <dl>
                <dt>标题</dt>
                <dd>描述</dd>
            </dl>
            <table border="1">
                <tr>
                    <th>姓名</th>
                    <th>成绩</th>
                </tr>
                <tr>
                    <td>WYF</td>
                    <td>100</td>
                </tr>
            </table>
            <input type="text" placeholder="请输入文本">
            <br>
            <input type="password" placeholder="请输入密码">
            <br>
            <label for="man">男</label>
            <input type="radio" name="gender" id="man" checked>
            <label> 女<input type="radio" name="gender"> </label>
            <br>
            同意以上条款<input type="checkbox" checked>
            <br>
            <input type="file" multiple>
            <br>
            <select>
                <option>北京</option>
                <option>上海</option>
                <option selected>广州</option>
            </select>
            <br>
            <textarea placeholder="请输入文本域">这是文本域</textarea>
            <br>
            <button type="submit">提交</button>
            <button type="reset">重置</button>
            <button type="button">普通</button>
        </form>
    </body>
</html>
