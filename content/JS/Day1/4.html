<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ryan的网页</title>
    </head>
    <body>
        <script>
            let num1=15
            let num2=20
            let temp
            document.write('原先的两个数<br>')
            document.write(num1,'<br>',num2,'<br>')
            temp=num1
            num1=num2
            num2=temp
            document.write('交换后的两个数<br>')
            document.write(num1,'<br>',num2,'<br>')
        </script>
    </body>
</html>
