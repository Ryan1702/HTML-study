<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ryan的网页</title>
        <style>
            * {
                margin:0;
                padding:0;
            }
            .box {
                width:50vw;
                height:30vw;
                background-color:pink;
            }
        </style>
    </head>
    <body>
        <div class="box"></div>
        <!--vw vh = view width/height 根据视口大小决定-->
        <!--1vw=1/100总宽 1vh=1/100总高-->
        <!--vw和vh不能混用 因为手机屏幕的长宽比不固定 如果混着盒子比例会错-->
    </body>
</html>
