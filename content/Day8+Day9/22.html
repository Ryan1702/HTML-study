<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ryan的网页</title>
        <style>
            .va {
                vertical-align:middle /*高度中点对齐*/
                /*默认是baseline 基线对齐 基线 就是 英语四线三格的倒二横线*/
                /*top 顶对齐 最高点对齐*/
                /*bottom 底对齐 同理*/
            }
            /*行内块会被当做文字导致按照基线对齐 图片底部会有一小条空白*/
        </style>
    </head>
    <body>
        <div>
            <img src="../Day1/diamond.jpeg" alt="" width="100px" class="va">
            <span>123</span>
        </div>
    </body>
</html>
